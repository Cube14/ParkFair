<?xml version="1.0" encoding="UTF-8"?>
<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="metal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="35%" stop-color="#cbd5e1"/>
      <stop offset="65%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="#050505"/>

  <!-- Orbit ring inspired by reference -->
  <g transform="rotate(-12 512 512)">
    <ellipse cx="512" cy="470" rx="330" ry="95"
             fill="none" stroke="url(#metal)" stroke-width="18"
             stroke-linecap="round"/>
  </g>

  <!-- Parking/P monogram -->
  <g>
    <path d="M455 320 L455 710" stroke="url(#metal)" stroke-width="42" stroke-linecap="round"/>
    <path d="M455 340
             C620 340 650 420 650 480
             C650 540 620 620 455 620"
          fill="none" stroke="url(#metal)" stroke-width="42" stroke-linecap="round"/>
  </g>

  <!-- Fairness star -->
  <g filter="url(#glow)">
    <path d="M512 390 L540 500 L512 610 L484 500 Z"
          fill="url(#metal)"/>
    <path d="M402 500 L512 472 L622 500 L512 528 Z"
          fill="url(#metal)"/>
  </g>

  <!-- Name -->
  <text x="512" y="860"
        font-family="Segoe UI, Arial, sans-serif"
        font-size="92"
        font-weight="700"
        text-anchor="middle"
        fill="url(#metal)">ParkFair</text>

  <text x="512" y="920"
        font-family="Segoe UI, Arial, sans-serif"
        font-size="30"
        letter-spacing="8"
        text-anchor="middle"
        fill="#cbd5e1">FAIR PARKING ROTATION</text>
</svg>
