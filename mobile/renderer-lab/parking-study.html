<title>ParkFair Siddha-A parking schematic</title>
<style>

.bay { appearance:none; border:0; border-radius:2px; padding:3px 1px; background:var(--paper); color:var(--ink); -webkit-tap-highlight-color:transparent;

.bay.tandem { padding-inline:4px; }
.bay.outdoor { font-size:8px; }
.bay[aria-pressed=true] { outline:1px solid var(--gold); }

.bay:focus-visible { outline:2px solid var(--gold); outline-offset:1px; }
.aisle { pointer-events:none; padding:4px 7px; background:var(--plate); color:var(--ink);
