<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ParkFair garage renderer study</title>
<script type="module" src="viewer.js"></script>
<style>
  body { margin:0; background:#e9e5dc; color:#262a23; font:16px system-ui; }
  main { max-width:1000px; margin:auto; padding:20px; }
  h1 { font:36px Georgia,serif; }
  button { min-height:48px; padding:8px 16px; background:#364237; color:white; border:0; border-radius:8px; }
  #scene { background:#f7f3ea; aspect-ratio:4/3; max-height:65vh; margin:16px 0; display:grid; place-items:center; }
  model-viewer { width:100%; height:100%; background:linear-gradient(#d3d0c7,#f4f0e8); }
</style>
<main>
  <h1>Garage renderer study</h1>
  <button type="button" id="toggle" aria-pressed="false">Load orbit study</button>
  <div id="scene"><p>Eco mode · 3D scene paused.</p></div>
  <p id="status" aria-live="polite">Toy Car by Guido Odendahl and Eric Chadwick · CC0.</p>
</main>
<script>
  const scene = document.querySelector('#scene');
  const toggle = document.querySelector('#toggle');
  const status = document.querySelector('#status');

  function unload() {
    if (!scene.querySelector('model-viewer')) return;
    scene.innerHTML = '<p>Eco mode · 3D scene paused.</p>';
    toggle.textContent = 'Load orbit study';
    toggle.setAttribute('aria-pressed', 'false');
    status.textContent = 'Scene released. Reopen to continue.';
  }

  toggle.addEventListener('click', () => {
    if (scene.querySelector('model-viewer')) {
      unload();
      return;
    }
    const viewer = document.createElement('model-viewer');
    viewer.setAttribute('src', 'ToyCar.glb');
    viewer.setAttribute('alt', 'Unbranded automotive materials sample');
    viewer.setAttribute('camera-controls', '');
    viewer.setAttribute('interaction-prompt', 'none');
    viewer.setAttribute('touch-action', 'pan-y');
    viewer.setAttribute('environment-image', 'neutral');
    viewer.setAttribute('shadow-intensity', '1');
    viewer.addEventListener('load', () => { status.textContent = 'Scene ready · drag to orbit or pinch to zoom.'; });
    viewer.addEventListener('error', () => { unload(); status.textContent = 'The model could not load.'; });
    scene.replaceChildren(viewer);
    toggle.textContent = 'Release 3D scene';
    toggle.setAttribute('aria-pressed', 'true');
    status.textContent = 'Loading the material sample…';
  });
  document.addEventListener('visibilitychange', () => { if (document.hidden) unload(); });
  window.addEventListener('pagehide', unload);
</script>
</html>
