services:
  mongo:
    image: mongo:8.0
    command: ["mongod", "--replSet", "parkfair-dev", "--bind_ip_all"]
    ports:
      - "127.0.0.1:${PARKFAIR_MONGO_PORT:-27017}:27017"
    volumes:
      - parkfair_dev_data:/data/db
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet --eval
          'try { if (db.hello().isWritablePrimary) quit(0); if (!rs.status().ok) quit(1); }
          catch (e) { if (e.code === 94) rs.initiate({_id:"parkfair-dev",members:[{_id:0,host:"localhost:27017"}]}); }
          quit(1)'
      interval: 3s
      timeout: 5s
      retries: 25
volumes:
  parkfair_dev_data:
